{% set name = "sahi" %}
{% set version = "0.12.0" %}
{% set python_min = "3.9" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/sahi-{{ version }}.tar.gz
  sha256: 18c8247733e1fce684863f749e7754fa07254b60d9b5ee4dcf7b5fc45257a9c7

build:
  number: 0
  noarch: python
  entry_points:
    - sahi=sahi.cli:app
  script: {{ PYTHON }} -m pip install . -vv

requirements:
  host:
    - pip
    - python {{ python_min }}
    - hatchling
  run:
    - numpy
    - opencv >=4.12.0.88
    - click
    - fire
    - pillow >=8.2.0
    - py-opencv <=4.11.0.86
    - pybboxes ==0.1.6
    - python >={{ python_min }}
    - gstreamer
    - gst-plugins-base
    - gst-plugins-good
    - pytorch >=2.4.1
    - pyyaml
    - requests
    - shapely >=2.0.0
    - terminaltables
    - tqdm >=4.48.2

test:
  imports:
    - sahi
    - sahi.postprocess
  commands:
    - pip check
    - sahi --help
  requires:
    - pip
    - python {{ python_min }}

about:
  home: https://github.com/obss/sahi
  summary: A vision library for performing sliced inference on large images/small objects
  license: MIT
  license_file: LICENSE

extra:
  recipe-maintainers:
    - onuralpszr
    - fcakyon
    - weiji14
